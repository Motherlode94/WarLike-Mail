name: Security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: c++ -std=c++20 -O2 -Wall -Wextra -Werror native/path_guard.cpp -o /tmp/warlike-path-guard
      - run: /tmp/warlike-path-guard --self-test
      - run: python3 -m unittest discover -s security -p 'test_*.py'
      - run: python3 security/audit.py --root .
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.25.0'
          run_install: false
      - run: npm run install:ci
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: node node_modules/typescript/bin/tsc --noEmit

  windows-client:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project desktop-csharp/tests/NavigationTests.csproj
      - run: dotnet publish desktop-csharp/WarLike.Mail.csproj -c Release -r win-x64 --self-contained true -o desktop-csharp/release
